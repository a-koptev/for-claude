# Coordinates use the 1280x720 frame used by Tracking.py.
# Fill empty lists with REAL capture-zone polygon points [x, y].
# Empty polygons disable sampling safely; topology/transition lines are not capture zones.
# Cameras 2 and 3 use side-specific zones; all other cameras use DEFAULT.
sample_every_n_frames: 3
similarity_threshold: 0.90
min_crop_size: 8

cameras:
  1:
    DEFAULT: []
  2:
    LEFT: []
    RIGHT: []
  3:
    LEFT: []
    RIGHT: []
  4:
    DEFAULT: []
  5:
    DEFAULT: []
  6:
    DEFAULT: []
  7:
    DEFAULT: []
  8:
    DEFAULT: []
  9:
    DEFAULT: []
