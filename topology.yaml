# Сеть камер парковки и линии перехода между камерами.
# Проверка файла после правок:  python check_topology.py
#
# frame_size - система координат линий. Tracking.py приводит кадр к 1280x720 до трекинга,
#              поэтому координаты нужно снимать с кадра именно такого размера.
#              Для отдельной камеры можно переопределить: frame_size: [1920, 1080]
#
# ЛИНИЯ (элемент списка lines у камеры) связывает эту камеру с ОДНОЙ соседней и работает в обе стороны.
#   id    - номер линии, уникален в пределах камеры
#   p1,p2 - концы линии [x, y] в пикселях кадра
#   peer  - номер соседней камеры, с которой связывает линия
#   exit  - UP | DOWN | LEFT | RIGHT: в какую сторону по кадру едет авто, когда УЕЗЖАЕТ
#           с этой камеры в камеру peer. Обратное движение через линию значит "приехал из peer".
#
# Пересечением считается касание линии самим bbox (грани bbox не важны). Что делать с событием
# (искать трек на другой камере, пропускать к сравнению), решает логика выше; направление
# берётся из смещения центра bbox относительно предыдущего кадра.
#
# Направление exit должно идти поперёк линии (не вдоль неё): check_topology.py сообщит об ошибке.
# Линию желательно нарисовать на обеих камерах пары (на камере 1 к камере 4 и на камере 4 к камере 1):
# так переход виден с обеих сторон; если линия есть только на одной камере, будет предупреждение.
#
# ПРИМЕР (камера 1 <-> камера 4):
#   - id: 1                      # камера 1
#     lines:
#       - {id: 1, p1: [900, 50], p2: [900, 650], peer: 4, exit: RIGHT}   # вправо уезжаем в камеру 4
#   - id: 4                      # камера 4
#     lines:
#       - {id: 1, p1: [100, 360], p2: [1180, 360], peer: 1, exit: DOWN}  # вниз уезжаем в камеру 1,
#                                                                         # вверх - приехали из камеры 1
#
# segments - необязательно: свойства участков маршрута между камерами.
#   preserve_order: true, если на участке автомобили не могут меняться местами
#   (участок без записи считается preserve_order: false)
#   Пример:  - {from: 1, to: 5, preserve_order: true}

frame_size: [1280, 720]

cameras:
  - id: 1
    name: "Камера 1"
    lines:
      - {id: 1, p1: [1100, 100], p2: [1100, 650], peer: 9, exit: RIGHT}
      - {id: 2, p1: [5, 500], p2: [650, 500], peer: 4, exit: DOWN}

  - id: 2
    name: "Камера 2"
    lines: 
      - {id: 1, p1: [500, 100], p2: [800, 100], peer: 9, exit: UP}
      - {id: 2, p1: [1000, 100], p2: [1000, 650], peer: 4, exit: RIGHT}

  - id: 3
    name: "Камера 3"
    lines:
      - {id: 1, p1: [500, 100], p2: [800, 100], peer: 4, exit: UP}
      - {id: 2, p1: [350, 100], p2: [350, 700], peer: 9, exit: LEFT}

  - id: 4
    name: "Камера 4"
    lines: 
      - {id: 1, p1: [70, 250], p2: [270, 250], peer: 2, exit: UP}
      - {id: 2, p1: [70, 250], p2: [270, 250], peer: 3, exit: UP}
      - {id: 3, p1: [650, 270], p2: [1250, 270], peer: 5, exit: UP}

  - id: 5
    name: "Камера 5"
    lines: 
      - {id: 1, p1: [800, 50], p2: [1200, 50], peer: 4, exit: UP}
      - {id: 2, p1: [440, 400], p2: [1250, 400], peer: 6, exit: DOWN}

  - id: 6
    name: "Камера 6"
    lines: 
      - {id: 1, p1: [1000, 100], p2: [1200, 100], peer: 7, exit: UP}
      - {id: 2, p1: [550, 400], p2: [1250, 400], peer: 5, exit: DOWN}

  - id: 7
    name: "Камера 7"
    lines: 
      - {id: 1, p1: [1000, 150], p2: [1250, 150], peer: 6, exit: UP}
      - {id: 2, p1: [600, 450], p2: [1250, 450], peer: 8, exit: DOWN}

  - id: 8
    name: "Камера 8"
    lines: 
      - {id: 1, p1: [900, 100], p2: [1100, 100], peer: 9, exit: UP}
      - {id: 2, p1: [600, 450], p2: [1250, 450], peer: 7, exit: DOWN}

  - id: 9
    name: "Камера 9"
    lines: 
      - {id: 1, p1: [50, 300], p2: [400, 300], peer: 8, exit: UP}
      - {id: 2, p1: [1000, 300], p2: [1250, 300], peer: 2, exit: UP}

segments: []
