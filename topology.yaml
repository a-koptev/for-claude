# Сеть камер парковки и линии перехода между камерами.
# Проверка файла после правок:  python check_topology.py
#
# frame_size - система координат линий. Tracking.py приводит кадр к 1280x720 до трекинга,
#              поэтому координаты нужно снимать с кадра именно такого размера.
#              Для отдельной камеры можно переопределить: frame_size: [1920, 1080]
#
# ЛИНИЯ (элемент списка lines у камеры)
#   id         - номер линии, уникален в пределах камеры
#   p1, p2     - концы линии [x, y] в пикселях кадра
#   crossings  - что значит пересечение линии краем bbox (одна линия - до нескольких правил)
#       edge   - каким краем bbox пересечена линия: TOP | BOTTOM | LEFT | RIGHT
#       role   - EXIT:  автомобиль покидает ЭТУ камеру
#                ENTER: автомобиль приезжает на ЭТУ камеру
#       camera - EXIT: в какую камеру уезжает; ENTER: из какой камеры приехал
#       motion - (необязательно) в какую сторону движется bbox в момент пересечения.
#                По умолчанию = edge, то есть событие даёт ВЕДУЩИЙ край: BOTTOM пересёк
#                линию при движении вниз, TOP - при движении вверх и т.д.
#                Задний край того же автомобиля пересечёт линию позже и в другую сторону,
#                он события не даёт. Укажите motion, если нужен именно задний край,
#                например "TOP при движении вниз" = автомобиль полностью прошёл линию.
#
# Край и движение не должны быть почти параллельны линии (LEFT/RIGHT на горизонтальной
# линии, TOP/BOTTOM на вертикальной): направление пересечения тогда не определить,
# check_topology.py сообщит об этом.
#
# ПРИМЕР (камера 1, горизонтальная линия у нижней части кадра):
#   lines:
#     - id: 1
#       p1: [100, 600]
#       p2: [1180, 600]
#       crossings:
#         - {edge: BOTTOM, role: EXIT,  camera: 5}   # уехал вниз -> камера 5
#         - {edge: TOP,    role: ENTER, camera: 2}   # приехал снизу из камеры 2, едет вверх
#
# segments - необязательно: свойства участков маршрута между камерами.
#   preserve_order: true, если на участке автомобили не могут меняться местами
#   (участок без записи считается preserve_order: false)
#   Пример:  - {from: 1, to: 5, preserve_order: true}

frame_size: [1280, 720]

cameras:
  - id: 1
    name: "Камера 1"
    lines: []

  - id: 2
    name: "Камера 2"
    lines: []

  - id: 3
    name: "Камера 3"
    lines: []

  - id: 4
    name: "Камера 4"
    lines: []

  - id: 5
    name: "Камера 5"
    lines: []

  - id: 6
    name: "Камера 6"
    lines: []

  - id: 7
    name: "Камера 7"
    lines: []

  - id: 8
    name: "Камера 8"
    lines: []

  - id: 9
    name: "Камера 9"
    lines: []

segments: []
